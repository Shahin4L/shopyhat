<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SHOPYHAT Sign-In Code</title></head>
<body style="font-family:Arial,sans-serif;background:#f5f2ee;padding:30px">
 <div style="max-width:520px;margin:auto;background:#ffffff;padding:28px;border-radius:18px">
  <h1 style="color:#222222;margin:0">SHOPYHAT</h1>
  <p style="color:#e87328">Private Operations Studio</p>
  <h2>Your secure sign-in code</h2>
  <p>Enter this one-time code to access your SHOPYHAT Admin.</p>
  <div style="font-size:32px;letter-spacing:7px;font-weight:bold;padding:15px;background:#fbf5ed;border-radius:12px;text-align:center">{{ .Token }}</div>
  <p>Alternatively, use this one-time link:</p>
  <p><a href="{{ .ConfirmationURL }}" style="background:#f47721;color:#171717;padding:12px 16px;text-decoration:none;border-radius:9px;display:inline-block">Sign in to Admin</a></p>
  <p style="color:#777;font-size:12px">If you did not request this email, ignore it. Do not share your code.</p>
 </div>
</body></html>

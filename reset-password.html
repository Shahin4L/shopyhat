<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset Password | SHOPYHAT</title><style>body{background:#1d110b;color:#f5e9df;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}main{box-sizing:border-box;background:#fffaf4;color:#261b13;max-width:480px;width:100%;border-radius:20px;padding:32px;box-shadow:0 25px 80px #0007}h1{font-size:26px}p{line-height:1.6;color:#70584a}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #d4bfb0;box-sizing:border-box;border-radius:9px}button{width:100%;background:#f47721;border:0;color:white;padding:13px;border-radius:9px;margin-top:17px;font-weight:700}a{color:#bc5c17}#msg{font-size:13px;padding-top:12px}</style><link rel="stylesheet" href="./customer-account.css?v=20261126-address-book"><script defer src="/i18n.js?v=20261126-bilingual-2"></script></head><body><main><div data-sh-language-host></div><h1>Set a new password</h1><p>Open this page from the recovery link sent to your account email.</p><form id="resetForm" hidden><label for="password">New password</label><input id="password" type="password" required minlength="8" autocomplete="new-password"><div id="resetStrengthSlot"></div><label for="confirm">Confirm password</label><input id="confirm" type="password" required minlength="8" autocomplete="new-password"><button type="submit">Update Password</button></form><p id="msg" role="status">Verifying recovery link…</p><p><a href="/account">Back to My Account</a></p></main><script type="module">import {bindPasswordStrength,passwordStrengthMarkup} from './password-strength.js?v=1';
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.10';const db=createClient('https://xwfqgmgiunlxzvzoermn.supabase.co','sb_publishable_Tk-PzYsM3YxnDsjicnMdzQ_mQsREdkP',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'sh_customer_auth_v1'}});
const form=document.getElementById('resetForm'),msg=document.getElementById('msg');
document.getElementById('resetStrengthSlot').innerHTML=passwordStrengthMarkup('shResetStrength');
const passwordInput=document.getElementById('password');
passwordInput.setAttribute('aria-describedby','shResetStrength');
bindPasswordStrength(passwordInput,document.getElementById('shResetStrength'));
let eligible=false;
const ready=async()=>{const {data,error}=await db.auth.getUser();if(data.user&&!error){eligible=true;form.hidden=false;msg.textContent='Your link has been verified. Set a new password.'}else{eligible=false;form.hidden=true;msg.textContent='This recovery link is invalid or expired. Request a new one from My Account.'}};
db.auth.onAuthStateChange(()=>setTimeout(ready,0));setTimeout(ready,1000);
form.addEventListener('submit',async e=>{e.preventDefault();if(!eligible)return;const a=document.getElementById('password').value,b=document.getElementById('confirm').value;if(a!==b){msg.textContent='Passwords do not match.';return}if(a.length<8){msg.textContent='Choose at least 8 characters.';return}const submit=form.querySelector('button');submit.disabled=true;try{const {error}=await db.auth.updateUser({password:a});if(error)throw error;await db.auth.signOut();form.hidden=true;msg.textContent='Password updated. Return to SHOPYHAT and sign in with your new password.'}catch(err){msg.textContent=err.message}finally{submit.disabled=false}});
</script></body></html>

name: SHOPYHAT Cinematic Storefront Quality Check
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin/**'
      - 'storefront-experience.*'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'customer-account.*'
      - 'reseller/**'
      - 'account-confirmed.html'
      - 'reset-password.html'
      - 'supabase/functions/shopyhat-checkout/**'
      - 'supabase/functions/shopyhat-reseller-access/**'
      - 'supabase/functions/shopyhat-courier/**'
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check storefront-experience.js
          node --check admin/experience.js
          node --check admin/app.js
          node --check admin/promotions.js
          node --check admin/resellers.js
          node --check customer-account.js
          node --check reseller/app.js
          node --check scripts/verify-customer-features.mjs
          node scripts/verify-customer-features.mjs
          node --check scripts/verify-admin-ux.mjs
          node scripts/verify-admin-ux.mjs
          node --check scripts/verify-reseller-studio.mjs
          node scripts/verify-reseller-studio.mjs
          node --check scripts/verify-storefront.mjs
          node scripts/verify-storefront.mjs
      - name: Validate vector illustration
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('assets/shopyhat-cinematic-art.svg')"
      - name: Verify site build
        run: npm test
